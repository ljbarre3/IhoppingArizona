version: "3.9"

services:
  db:
    image: postgres:17
    container_name: ihop-postgres
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: ihop-backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env

volumes:
  postgres-data: